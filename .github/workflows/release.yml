name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$declared" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $declared" >&2
            exit 1
          fi

      - name: Check code
        run: |
          npm run check
          npm run build

      - name: Publish to npm
        run: npm run release -- publish
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Prepare release
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run --silent build-change-log -- "$version" --extract > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      # The playground imports the model package from the root install.
      - name: Install root dependencies
        run: npm ci

      - name: Install playground dependencies
        run: npm ci
        working-directory: playground

      - name: Build playground
        run: npm run build
        working-directory: playground

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
