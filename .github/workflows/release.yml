name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$declared" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the package version $declared" >&2
            exit 1
          fi

      - name: Check code
        run: |
          npm run check
          npm run build

      # The token is the fallback for a registry that does not answer the OIDC request.
      - name: Publish to npm
        run: npm run release -- publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Prepare release
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run build-change-log -- "$version" --extract > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
